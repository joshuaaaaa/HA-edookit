# Example automations for the Edookit integration.

# Wake-up alarm 70 minutes before the first lesson (works with a phone alarm,
# a light, a speaker...). Uses the "Začátek vyučování dnes" timestamp sensor.
- alias: "Škola – budíček před první hodinou"
  triggers:
    - trigger: template
      value_template: >
        {% set start = states('sensor.edookit_jan_novak_zacatek_vyucovani_dnes') %}
        {{ start not in ['unknown', 'unavailable']
           and now() >= as_datetime(start) - timedelta(minutes=70) }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.detsky_pokoj
      data:
        brightness_pct: 60

# Evening reminder: tomorrow's subjects so the school bag gets packed.
- alias: "Škola – co zabalit na zítra"
  triggers:
    - trigger: time
      at: "19:00:00"
  conditions:
    - condition: state
      entity_id: binary_sensor.edookit_jan_novak_skola_zitra
      state: "on"
  actions:
    - action: notify.mobile_app_telefon
      data:
        title: "Zítra do školy"
        message: >
          {{ state_attr('sensor.edookit_jan_novak_hodiny_zitra', 'subjects') | join(', ') }}
          {%- set hw = state_attr('sensor.edookit_jan_novak_domaci_ukoly', 'items') or [] %}
          {%- if hw %}. Úkoly: {{ hw | map(attribute='title') | join(', ') }}{% endif %}

# Announce new grades on a speaker.
- alias: "Škola – nová známka"
  triggers:
    - trigger: event
      event_type: edookit_new_item
      event_data:
        type: evaluation
  actions:
    - action: tts.speak
      target:
        entity_id: tts.google_translate_cs_cz
      data:
        media_player_entity_id: media_player.kuchyn
        message: "Nová známka z předmětu {{ trigger.event.data.title }}: {{ trigger.event.data.grade }}"

# Notify 10 minutes before the child arrives home (sensor: end of school + travel time).
- alias: "Škola – dítě přijde domů"
  triggers:
    - trigger: template
      value_template: >
        {% set t = states('sensor.edookit_jan_novak_prichod_domu') %}
        {{ t not in ['unknown', 'unavailable'] and now() >= as_datetime(t) - timedelta(minutes=10) }}
  actions:
    - action: notify.mobile_app_telefon
      data:
        message: "Jan dorazí domů kolem {{ as_timestamp(states('sensor.edookit_jan_novak_prichod_domu')) | timestamp_custom('%H:%M') }}"

# ---------------------------------------------------------------- Telegram
# Requires the Telegram bot integration (telegram_bot) set up in Home Assistant.

# Every new Edookit message with its full text (event fired by the integration).
- alias: "Edookit – nová zpráva na Telegram"
  triggers:
    - trigger: event
      event_type: edookit_new_item
      event_data:
        type: inboxMessage
  actions:
    - action: telegram_bot.send_message
      data:
        parse_mode: plain_text
        title: "✉️ {{ trigger.event.data.title }}"
        message: >-
          {{ trigger.event.data.student }} · {{ trigger.event.data.creator }} · {{ trigger.event.data.time }}

          {{ trigger.event.data.text }}
          {% if trigger.event.data.attachments %}

          📎 {{ trigger.event.data.attachments | join(', ') }}{% endif %}

          {{ trigger.event.data.url }}

# Alternative: send the ready-made text of the "Poslední zpráva – text" sensor when it changes.
- alias: "Edookit – poslední zpráva (senzor) na Telegram"
  triggers:
    - trigger: state
      entity_id: sensor.edookit_laura_hruba_posledni_zprava_text
      attribute: url
  conditions:
    - condition: template
      value_template: "{{ trigger.from_state is not none and trigger.to_state.attributes.url is not none }}"
  actions:
    - action: telegram_bot.send_message
      data:
        parse_mode: plain_text
        message: "{{ state_attr('sensor.edookit_laura_hruba_posledni_zprava_text', 'notification') }}"

# Sunday evening: list of upcoming written tests, nearest first.
- alias: "Edookit – písemky na příští týden"
  triggers:
    - trigger: time
      at: "18:00:00"
  conditions:
    - condition: time
      weekday: [sun]
  actions:
    - action: telegram_bot.send_message
      data:
        parse_mode: plain_text
        title: "📝 Nadcházející písemky – Laura"
        message: "{{ state_attr('sensor.edookit_laura_hruba_nadchazejici_pisemky', 'text') }}"
